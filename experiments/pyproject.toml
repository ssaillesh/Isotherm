[project]
name = "isotherm-experiments"
version = "0.1.0"
description = "Baseline policies, OR-Tools batch placement, and plots; talks to the sim over gRPC"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "protobuf>=5.28",
  "ortools>=9.10",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "grpcio-tools>=1.66"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
